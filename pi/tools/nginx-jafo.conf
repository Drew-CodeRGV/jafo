# jafo nginx config
# Installed at /etc/nginx/sites-available/jafo, symlinked from sites-enabled.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Bigger range buffers for audio streaming
    client_max_body_size 1m;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Static files served by nginx directly
    location /static/ {
        alias /home/pi/jafo/pi/web/static/;
        expires 1h;
        access_log off;
    }

    # Audio streaming with byte-range support.
    # Flask handles this fine with send_file conditional=True; we proxy.
    # Important: pass Range header through and disable proxy buffering so the
    # browser can scrub the audio element without playback getting cut off.
    location /audio/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # Everything else → Flask
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
