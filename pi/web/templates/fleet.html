<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jafo — fleet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/logo.png" type="image/png">
<style>
  body { padding: 0; }
  .fleet-hero { padding: 24px 32px 12px; display:flex; align-items:center; gap:16px; }
  .fleet-hero img { height: 48px; }
  .fleet-hero h1 { margin: 0; font-size: 28px; }
  .fleet-hero p { margin: 4px 0 0; color: var(--text-dim,#aaa); }
  #fleet-map { height: 50vh; }
  .region-grid { display:grid; gap:14px; padding: 20px 32px; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); }
  .region-card { padding:16px; background: var(--bg-alt,#1a1a1a); border-radius:10px; border:1px solid var(--border,#2a2a2a); transition: border-color .15s; cursor:pointer; }
  .region-card:hover { border-color: var(--accent,#4cc06b); }
  .region-card h3 { margin: 0 0 4px; }
  .region-card .desc { font-size: 13px; color: var(--text-dim,#aaa); margin-bottom: 12px; }
  .region-card .stats { display:flex; gap: 16px; font-size: 13px; }
  .region-card .stats span { color: var(--text-dim,#aaa); }
  .region-card .stats b { color: inherit; }
  a.region-card { text-decoration: none; color: inherit; display: block; }
</style>
</head>
<body>
<header class="fleet-hero">
  <img src="/static/logo.png" alt="">
  <div>
    <h1>jafo fleet</h1>
    <p>Just Another F***ing Observer — passive radio observatory clearing house.</p>
  </div>
</header>
<div id="fleet-map"></div>
<div id="region-cards" class="region-grid"></div>
<script>
const map = L.map('fleet-map', { zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{y}/{x}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

(async () => {
  const [regions, nodes] = await Promise.all([
    fetch('/api/regions').then(r => r.json()),
    fetch('/api/fleet/nodes').then(r => r.json()),
  ]);
  // Map bounds: union of all node coordinates
  const pts = nodes.nodes.filter(n => n.lat && n.lng);
  if (pts.length) {
    const b = L.latLngBounds(pts.map(n => [n.lat, n.lng]));
    map.fitBounds(b.pad(0.4), { maxZoom: 8 });
  } else {
    map.setView([26.2, -98.2], 9);
  }
  // Markers per node
  pts.forEach(n => {
    L.marker([n.lat, n.lng])
      .bindPopup(`<b>${n.display_name}</b><br>region: <a href="/r/${n.region_slug}">${n.region_slug}</a><br>${n.calls_24h||0} calls in last 24h<br><a href="/r/${n.region_slug}/n/${n.slug}">Open node →</a>`)
      .addTo(map);
  });
  // Region cards
  document.getElementById('region-cards').innerHTML = regions.regions.map(r => `
    <a href="/r/${r.slug}" class="region-card">
      <h3>${r.name}</h3>
      <div class="desc">${r.description||''}</div>
      <div class="stats">
        <span><b>${r.node_count}</b> nodes</span>
        <span><b>${(r.calls_24h||0).toLocaleString()}</b> calls / 24h</span>
        <span><b>${(r.call_count||0).toLocaleString()}</b> total</span>
      </div>
    </a>`).join('');
})();
</script>
</body>
</html>
